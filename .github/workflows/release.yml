name: Build and attest release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The build:backend script expects a venv at the repo root (..\venv)
      - name: Create Python venv and install backend deps
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\python -m pip install --upgrade pip
          venv\Scripts\pip install -r backend\requirements.txt pyinstaller
          venv\Scripts\pyinstaller --version

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install electron deps
        working-directory: electron
        run: npm ci

      - name: Build backend (PyInstaller)
        working-directory: electron
        run: npm run build:backend

      - name: Build frontend (Vite)
        working-directory: electron
        run: npm run build:frontend

      - name: Package app (electron-builder, portable exe)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --publish never

      - name: Collect release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          Copy-Item $exe.FullName out\PRM.exe
          Compress-Archive -Path out\PRM.exe -DestinationPath out\PRM.zip
          Get-FileHash out\PRM.exe, out\PRM.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/PRM.exe
            out/PRM.zip

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRM-${{ github.sha }}
          path: out/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Built by GitHub Actions from commit ${{ github.sha }}.

          Verify this download came from this repo's source:
              gh attestation verify PRM.zip --repo ${{ github.repository }}

          SHA-256:
          $(Get-Content out\SHA256SUMS.txt -Raw)
          "@
          gh release create "${{ github.ref_name }}" out\PRM.exe out\PRM.zip out\SHA256SUMS.txt `
            --title "${{ github.ref_name }}" --notes $notes
